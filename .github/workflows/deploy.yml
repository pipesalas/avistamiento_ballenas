name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  PROJECT_ID: avistamientos-166c4
  REGION: us-central1
  SERVICE: avistamientos-api

jobs:
  deploy:
    name: Build, Test & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Run frontend tests
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test

      - name: Run backend tests
        run: uv run --python 3.12 --with-requirements requirements-dev.txt python -m pytest -q

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/730356909175/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deploy@avistamientos-166c4.iam.gserviceaccount.com

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Cloud Run & Firebase Hosting
        run: bash scripts/deploy.sh "$PROJECT_ID"
